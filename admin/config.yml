backend:
  name: git-gateway
  branch: main
  base_url: https://moonlightbookreader.netlify.app

media_folder: "content/images"
public_folder: "/content/images"

collections:
  - name: books
    label: Book Reviews
    folder: "content/books"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Author", name: "author", widget: "string"}
      - {label: "Category", name: "category", widget: "select", options: ["Fiction", "Fantasy", "Mystery", "Sci-Fi", "Romance", "Non-Fiction", "Classics"]}
      - {label: "Rating", name: "rating", widget: "number", min: 1, max: 5}
      - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Cover Image", name: "coverImage", widget: "image", required: false}
      - {label: "Excerpt", name: "excerpt", widget: "text"}
      - {label: "Full Review", name: "fullReview", widget: "markdown"}
      - {label: "Highlights", name: "highlights", widget: "list", field: {label: "Point", name: "point", widget: "string"}}
      - {label: "Verdict", name: "verdict", widget: "text"}

  - name: journal
    label: Journal Entries
    folder: "content/journal"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Type", name: "type", widget: "select", options: ["OBSERVATION", "OPINION", "HOT TAKE", "REFLECTION", "QUOTE"]}
      - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Content / Text", name: "text", widget: "text"}
      - {label: "Attribution (for quotes)", name: "attribution", widget: "string", required: false}

  - name: site
    label: Site Settings
    files:
      - name: site
        label: Profile & Social
        file: "content/site.json"
        fields:
          - {label: "Your Name", name: "name", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Profile Image", name: "profileImage", widget: "image", required: false}
          - {label: "Goodreads URL", name: "goodreads", widget: "string", required: false}
          - {label: "Storygraph URL", name: "storygraph", widget: "string", required: false}
          - {label: "Instagram URL", name: "instagram", widget: "string", required: false}
          - {label: "Twitter URL", name: "twitter", widget: "string", required: false}
          - {label: "Email", name: "email", widget: "string", required: false}
      - name: about
        label: About Section
        file: "content/about.json"
        fields:
          - {label: "Intro Line", name: "introLine", widget: "string"}
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Bio Paragraphs", name: "bioParagraphs", widget: "list", field: {label: "Paragraph", name: "para", widget: "text"}}
          - {label: "Sign-off Line", name: "signoff", widget: "string"}
