backend:
  name: github
  repo: moonlightbookreader/moonlightbookreader
  branch: main
  base_url: https://moonlightbookreader.netlify.app

media_folder: "content/images"
public_folder: "/content/images"

collections:
  - name: books
    label: Book Reviews
    folder: "content/books"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Author", name: "author", widget: "string"}
      - {label: "Category", name: "category", widget: "select", options: ["Fiction", "Fantasy", "Mystery", "Sci-Fi", "Romance", "Non-Fiction", "Classics"]}
      - {label: "Rating", name: "rating", widget: "number", min: 1, max: 5}
      - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Cover Image", name: "coverImage", widget: "image", required: false}
      - {label: "Excerpt", name: "excerpt", widget: "text"}
      - {label: "Full Review", name: "fullReview", widget: "markdown"}
      - {label: "Highlights", name: "highlights", widget: "list", field: {label: "Point", name: "point", widget: "string"}}
      - {label: "Verdict", name: "verdict", widget: "text"}

  - name: journal
    label: Journal Entries
    folder: "content/journal"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Category Tag", name: "tag", widget: "string", required: false}
      - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Read Time / Note", name: "note", widget: "string", required: false}
      - {label: "Content", name: "content", widget: "markdown"}

  - name: site
    label: Site Settings
    files:
      - name: about
        label: About Section
        file: "content/about.json"
        fields:
          - {label: "Profile Image", name: "profileImage", widget: "image", required: false}
          - {label: "Bio Paragraph 1", name: "bio1", widget: "text"}
          - {label: "Bio Paragraph 2", name: "bio2", widget: "text"}
          - {label: "Closing Line", name: "closingLine", widget: "string"}
      - name: social
        label: Social Links
        file: "content/social.json"
        fields:
          - {label: "Goodreads", name: "goodreads", widget: "string", required: false}
          - {label: "Storygraph", name: "storygraph", widget: "string", required: false}
          - {label: "Instagram", name: "instagram", widget: "string", required: false}
          - {label: "Threads", name: "threads", widget: "string", required: false}
          - {label: "Twitter", name: "twitter", widget: "string", required: false}
          - {label: "Email", name: "email", widget: "string", required: false}
