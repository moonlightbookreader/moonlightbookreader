<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Moonlight Book Reader</title>
  <!-- Try multiple CDN sources as fallback -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.5.0/dist/decap-cms.min.js"></script>
  <script>
    // Fallback: load from second CDN if first fails
    window.addEventListener('load', function() {
      setTimeout(function() {
        if (!window.CMS) {
          const s = document.createElement('script');
          s.src = 'https://unpkg.com/decap-cms@3.5.0/dist/decap-cms.min.js';
          document.head.appendChild(s);
        }
      }, 3000);
    });
  </script>
  <style>
    body { margin: 0; background: #150c2b; font-family: 'Lora', serif; color: #f5e6d3; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    #root { width: 100%; }
    .note { text-align: center; padding: 40px; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
