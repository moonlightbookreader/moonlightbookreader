<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Moonlight Book Reader</title>
  <script src="https://cdn.jsdelivr.net/npm/netlify-identity-widget@1.12.0/build/netlify-identity-widget.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.5.0/dist/decap-cms.min.js"></script>
  <style>
    body { background: #150c2b; color: #f5e6d3; font-family: sans-serif; text-align: center; padding-top: 3rem; }
    .btn { background: #d4a857; color: #150c2b; border: none; padding: 0.75rem 2rem; font-size: 1rem; border-radius: 6px; cursor: pointer; margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.init({
        APIUrl: "https://moonlightbookreader.netlify.app/.netlify/identity"
      });
    }
  </script>
</body>
</html>
