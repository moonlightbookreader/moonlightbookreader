<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Review — Moonlight Book Reader</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars-bg"></div>
  <div class="page-wrapper">
    <div class="container">
      <header class="site-header">
        <div class="site-brand">
          <a href="index.html" class="site-title">Moonlight Book Reader</a>
          <p class="site-tagline" id="siteTagline">your nocturnal reading companion</p>
        </div>
        <nav>
          <a href="index.html">Home</a>
          <a href="books.html" class="active">Reviews</a>
          <a href="journal.html">Journal</a>
          <a href="about.html">About</a>
        </nav>
      </header>
      <section>
        <div id="singleBook">
          <!-- Full review loads here -->
          <div class="empty-state">Loading review... ✨</div>
        </div>
      </section>
    </div>
    <footer class="site-footer">
      <p><span class="handwritten">☾ Moonlight Book Reader · written under the same moon ✨</span></p>
    </footer>
  </div>
  <script src="script.js"></script>
  <script>
    loadAllData().then(() => {
      renderProfile();
      renderSocialLinks('socialLinks');
      
      const bookId = getUrlParam('id');
      const container = document.getElementById('singleBook');
      
      if (!bookId) {
        container.innerHTML = '<div class="empty-state">Book not found ✨</div>';
        return;
      }
      
      const book = books.find(b => b.id === bookId);
      if (!book) {
        container.innerHTML = '<div class="empty-state">Book not found ✨</div>';
        return;
      }
      
      container.innerHTML = renderBookCard(book, true);
    });
  </script>
</body>
</html>
