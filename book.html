<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Review — Moonlight Book Reader</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">
    <div class="container">
      <header class="site-header">
        <div class="site-brand">
          <a href="index.html" class="site-title">Moonlight Book Reader</a>
          <p class="site-tagline" id="siteTagline">your nocturnal reading companion</p>
        </div>
        <nav>
          <a href="index.html">Home</a>
          <a href="books.html" class="active">Reviews</a>
          <a href="journal.html">Journal</a>
          <a href="about.html">About</a>
        </nav>
      </header>

      <p class="breadcrumb"><a href="books.html">← Back to all reviews</a></p>
      <div id="bookDetail"></div>

    </div>
    <footer class="site-footer">
      <p><span class="handwritten">☾ Moonlight Book Reader · written under the same moon ✨</span></p>
    </footer>
  </div>
  <script src="script.js"></script>
  <script>
    loadAllData().then(() => {
      renderProfile();
      const bookId = getUrlParam('id');
      const book = books.find(b => b.id === bookId);
      const container = document.getElementById('bookDetail');
      if (!book) {
        container.innerHTML = '<div class="empty-state">Book not found. <a href="books.html" style="color:var(--accent);">Back to reviews</a></div>';
        document.title = 'Not Found — Moonlight Book Reader';
      } else {
        document.title = `${book.title} — Moonlight Book Reader`;
        container.innerHTML = renderBookCard(book, true);
      }
    });
  </script>
</body>
</html>
