<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Reviews — Moonlight Book Reader</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="moon-icon">☾</div>
      <h1 id="siteTitle">Moonlight Book Reader</h1>
      <p class="tagline" id="siteTagline">your nocturnal reading companion</p>
    </header>

    <nav>
      <a href="index.html">Home</a>
      <a href="books.html" class="active">Reviews</a>
      <a href="journal.html">Journal</a>
      <a href="about.html">About</a>
    </nav>

    <h2 class="section-title">📚 Book Reviews</h2>
    <div id="allBooks"></div>

    <footer>
      <p>☾ Moonlight Book Reader · Written under the same moon ✨</p>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>
    loadAllData().then(() => {
      renderProfile();
      const container = document.getElementById('allBooks');
      if (books.length === 0) {
        container.innerHTML = '<div class="empty-state">No reviews yet... your first book awaits ✨</div>';
      } else {
        container.innerHTML = books.map(b => renderBookCard(b, false)).join('');
      }
    });
  </script>
</body>
</html>
