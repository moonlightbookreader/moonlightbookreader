<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Reviews — Moonlight Book Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <div class="stars"></div>
  <div class="moon-drift"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="site-brand">
        <a href="index.html" class="site-title">Moonlight Book Reader</a>
        <p class="site-tagline">your nocturnal reading companion</p>
      </div>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="books.html" class="active">Reviews</a>
        <a href="journal.html">Journal</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="content-wrapper">
    <section class="page-intro">
      <h1>Book Reviews</h1>
      <p>Stories explored and shared by moonlight.</p>
    </section>

    <div class="filter-container">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="Fiction">Fiction</button>
      <button class="filter-btn" data-filter="Contemporary">Contemporary</button>
      <button class="filter-btn" data-filter="Fantasy">Fantasy</button>
      <button class="filter-btn" data-filter="Mystery">Mystery</button>
      <button class="filter-btn" data-filter="Thriller">Thriller</button>
      <button class="filter-btn" data-filter="Sci-Fi">Sci-Fi</button>
      <button class="filter-btn" data-filter="Romance">Romance</button>
      <button class="filter-btn" data-filter="Non-Fiction">Non-Fiction</button>
      <button class="filter-btn" data-filter="Classics">Classics</button>
      <button class="filter-btn" data-filter="Young Adult">Young Adult</button>
    </div>

    <div id="reviews-container" class="cards-grid">
      <p class="loading">Gathering reviews by moonlight...</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>— Read by moonlight — © 2026 Moonlight Book Reader</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
