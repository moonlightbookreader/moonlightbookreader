media:
  input: content/images
  output: /content/images

content:
  - name: site
    label: Site Profile & Social
    type: file
    path: content/site.json
    fields:
      - name: name
        label: Your Name / Site Title
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: profileImage
        label: Profile Photo
        type: image
        required: false
      - name: goodreads
        label: Goodreads URL
        type: string
        required: false
      - name: storygraph
        label: Storygraph URL
        type: string
        required: false
      - name: instagram
        label: Instagram URL
        type: string
        required: false
      - name: twitter
        label: X / Twitter URL
        type: string
        required: false
      - name: threads
        label: Threads URL
        type: string
        required: false
      - name: tiktok
        label: TikTok URL
        type: string
        required: false
      - name: youtube
        label: YouTube URL
        type: string
        required: false
      - name: pinterest
        label: Pinterest URL
        type: string
        required: false
      - name: letterboxd
        label: Letterboxd URL
        type: string
        required: false
      - name: redbubble
        label: Redbubble Shop URL
        type: string
        required: false
      - name: amazon
        label: Amazon Profile URL
        type: string
        required: false
      - name: amazonWishlist
        label: Amazon Wishlist URL
        type: string
        required: false
      - name: etsy
        label: Etsy Shop URL
        type: string
        required: false
      - name: kofi
        label: Ko-fi URL
        type: string
        required: false
      - name: email
        label: Email Address
        type: string
        required: false

  - name: about
    label: About Page
    type: file
    path: content/about.json
    fields:
      - name: introLine
        label: Intro Line
        type: string
      - name: heading
        label: Heading
        type: string
      - name: bioParagraphs
        label: Biography Paragraphs
        type: text
        list: true
      - name: signoff
        label: Sign-off Line
        type: string

  - name: books
    label: Book Reviews
    type: file
    path: content/books.json
    fields:
      - name: entries
        label: Reviews
        type: object
        list: true
        fields:
          - name: id
            label: URL ID (no spaces)
            type: string
          - name: title
            label: Book Title
            type: string
          - name: author
            label: Author
            type: string
          - name: category
            label: Genres
            type: select
            multiple: true
            options:
              - label: Anthologies
                value: Anthologies
              - label: Art
                value: Art
              - label: Biography
                value: Biography
              - label: Children
                value: Children
              - label: Classics
                value: Classics
              - label: Comfort Reads
                value: Comfort Reads
              - label: Contemporary
                value: Contemporary
              - label: Cookbook
                value: Cookbook
              - label: Cozy Books
                value: Cozy Books
              - label: Dark Fantasy
                value: Dark Fantasy
              - label: Drama
                value: Drama
              - label: Epic Fantasy
                value: Epic Fantasy
              - label: Fantasy
                value: Fantasy
              - label: Fantasy Romance
                value: Fantasy Romance
              - label: Fiction
                value: Fiction
              - label: Graphic Novel
                value: Graphic Novel
              - label: Historical
                value: Historical
              - label: Historical Fiction
                value: Historical Fiction
              - label: Horror
                value: Horror
              - label: Memoir
                value: Memoir
              - label: Middle Grade
                value: Middle Grade
              - label: Mystery
                value: Mystery
              - label: New Adult
                value: New Adult
              - label: Non-Fiction
                value: Non-Fiction
              - label: Paranormal Romance
                value: Paranormal Romance
              - label: Philosophy
                value: Philosophy
              - label: Poetry
                value: Poetry
              - label: Psychological Thriller
                value: Psychological Thriller
              - label: Religion
                value: Religion
              - label: Romance
                value: Romance
              - label: Sci-Fi
                value: Sci-Fi
              - label: Self-Help
                value: Self-Help
              - label: Short Stories
                value: Short Stories
              - label: Thriller
                value: Thriller
              - label: Travel
                value: Travel
              - label: Urban Fantasy
                value: Urban Fantasy
              - label: Young Adult
                value: Young Adult
          - name: customGenres
            label: Custom Genres (comma separated)
            type: string
            required: false
          - name: format
            label: Format
            type: select
            options:
              - label: Physical
                value: Physical
              - label: E-Book
                value: E-Book
              - label: Audiobook
                value: Audiobook
              - label: ARC (Advanced Reader Copy)
                value: ARC (Advanced Reader Copy)
          - name: rating
            label: Rating (1-5)
            type: number
            min: 1
            max: 5
          - name: date
            label: Date Finished
            type: date
          - name: coverImage
            label: Book Cover Image
            type: image
            required: false
          - name: excerpt
            label: Short Excerpt
            type: text
          - name: fullReview
            label: Full Review
            type: rich-text
          - name: highlights
            label: Favorite Quotes
            type: text
            list: true
          - name: verdict
            label: Final Verdict
            type: text

  - name: journal
    label: Journal Entries
    type: file
    path: content/journal.json
    fields:
      - name: entries
        label: Entries
        type: object
        list: true
        fields:
          - name: id
            label: URL ID (no spaces)
            type: string
          - name: title
            label: Entry Title
            type: string
          - name: type
            label: Entry Type
            type: select
            options:
              - label: OBSERVATION
                value: OBSERVATION
              - label: OPINION
                value: OPINION
              - label: HOT TAKE
                value: HOT TAKE
              - label: REFLECTION
                value: REFLECTION
              - label: QUOTE
                value: QUOTE
              - label: BOOK HAUL
                value: BOOK HAUL
              - label: RECOMMENDATION
                value: RECOMMENDATION
              - label: LIFE
                value: LIFE
          - name: date
            label: Date
            type: date
          - name: text
            label: Entry Content
            type: rich-text
          - name: attribution
            label: Attribution
            type: string
            required: false
