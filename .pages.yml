media:
  input: content/images
  output: /content/images

content:
  - name: site
    label: Site Profile & Social
    type: file
    path: content/site.json
    fields:
      - name: name
        label: Your Name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: profileImage
        label: Profile Photo
        type: image
        optional: true
      - name: goodreads
        label: Goodreads URL
        type: string
        optional: true
      - name: storygraph
        label: Storygraph URL
        type: string
        optional: true
      - name: instagram
        label: Instagram URL
        type: string
        optional: true
      - name: twitter
        label: Twitter / X URL
        type: string
        optional: true
      - name: email
        label: Email Address
        type: string
        optional: true

  - name: about
    label: About Page
    type: file
    path: content/about.json
    fields:
      - name: introLine
        label: Intro Line
        type: string
      - name: heading
        label: Heading
        type: string
      - name: bioParagraphs
        label: Bio Text
        type: list
        items:
          type: textarea
      - name: signoff
        label: Sign-off Line
        type: string

  - name: books
    label: Book Reviews
    type: collection
    path: content/books
    fields:
      - name: title
        label: Title
        type: string
      - name: author
        label: Author
        type: string
      - name: category
        label: Category
        type: select
        options:
          - Fiction
          - Fantasy
          - Mystery
          - Sci-Fi
          - Romance
          - Non-Fiction
          - Classics
      - name: rating
        label: Rating
        type: number
        min: 1
        max: 5
      - name: date
        label: Date
        type: date
      - name: coverImage
        label: Cover Image
        type: image
        optional: true
      - name: excerpt
        label: Excerpt
        type: text
      - name: fullReview
        label: Full Review
        type: rich-text
      - name: highlights
        label: Highlights
        type: list
        items:
          type: string
      - name: verdict
        label: Verdict
        type: text

  - name: journal
    label: Journal Entries
    type: collection
    path: content/journal
    fields:
      - name: title
        label: Title
        type: string
      - name: type
        label: Type
        type: select
        options:
          - OBSERVATION
          - OPINION
          - HOT TAKE
          - REFLECTION
          - QUOTE
      - name: date
        label: Date
        type: date
      - name: text
        label: Content
        type: textarea
      - name: attribution
        label: Attribution
        type: string
        optional: true
