media:
  input: content/images
  output: content/images
content:
  - name: site
    label: Site Profile & Social
    type: file
    path: content/site.json
    fields:
      - name: name
        label: Your Name / Site Title
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: profileImage
        label: Profile Photo
        type: image
        required: false
      - name: goodreads
        label: Goodreads URL
        type: string
        required: false
      - name: storygraph
        label: Storygraph URL
        type: string
        required: false
      - name: instagram
        label: Instagram URL
        type: string
        required: false
      - name: twitter
        label: X / Twitter URL
        type: string
        required: false
      - name: threads
        label: Threads URL
        type: string
        required: false
      - name: tiktok
        label: TikTok URL
        type: string
        required: false
      - name: youtube
        label: YouTube URL
        type: string
        required: false
      - name: pinterest
        label: Pinterest URL
        type: string
        required: false
      - name: letterboxd
        label: Letterboxd URL
        type: string
        required: false
      - name: redbubble
        label: Redbubble Shop URL
        type: string
        required: false
      - name: amazon
        label: Amazon Profile URL
        type: string
        required: false
      - name: amazonWishlist
        label: Amazon Wishlist URL
        type: string
        required: false
      - name: etsy
        label: Etsy Shop URL
        type: string
        required: false
      - name: kofi
        label: Ko-fi URL
        type: string
        required: false
      - name: email
        label: Email Address
        type: string
        required: false
  - name: about
    label: About Page
    type: file
    path: content/about.json
    fields:
      - name: introLine
        label: Intro Line
        type: string
      - name: heading
        label: Heading
        type: string
      - name: bioParagraphs
        label: Biography Paragraphs
        type: text
        list: true
      - name: signoff
        label: Sign-off Line
        type: string
  - name: books
    label: Book Reviews
    type: file
    path: content/books.json
    fields:
      - name: entries
        label: Reviews
        type: object
        list: true
        fields:
          - name: id
            label: URL ID (no spaces)
            type: string
          - name: featured
            label: Mark as Featured Review
            type: boolean
            required: false
            default: false
          - name: title
            label: Book Title
            type: string
          - name: author
            label: Author
            type: string
          - name: mainGenre
            label: Main Genre
            type: select
            options:
              values:
                - Anthologies
                - Art
                - Biography
                - Children
                - Classics
                - Comfort Reads
                - Contemporary
                - Cookbook
                - Cozy Books
                - Dark Fantasy
                - Drama
                - Epic Fantasy
                - Fantasy
                - Fantasy Romance
                - Fiction
                - Graphic Novel
                - Historical
                - Historical Fiction
                - Horror
                - Memoir
                - Middle Grade
                - Mystery
                - New Adult
                - Non-Fiction
                - Paranormal Romance
                - Philosophy
                - Poetry
                - Psychological Thriller
                - Religion
                - Romance
                - Sci-Fi
                - Self-Help
                - Short Stories
                - Thriller
                - Travel
                - Urban Fantasy
                - Young Adult
          - name: otherGenres
            label: Other Genres (comma separated, e.g. Romance, Mystery)
            type: string
            required: false
          - name: format
            label: Format
            type: select
            options:
              values:
                - Physical
                - E-Book
                - Audiobook
                - ARC (Advanced Reader Copy)
          - name: rating
            label: Rating (1-5)
            type: number
            min: 1
            max: 5
          - name: date
            label: Date Finished
            type: date
          - name: startDate
            label: Date Started
            type: date
            required: false
          - name: coverImage
            label: Book Cover Image
            type: image
            required: false
          - name: excerpt
            label: Short Excerpt
            type: text
          - name: fullReview
            label: Full Review
            type: rich-text
          - name: highlights
            label: Favorite Quotes
            type: text
            list: true
          - name: verdict
            label: Final Verdict
            type: text
  - name: journal
    label: Journal Entries
    type: file
    path: content/journal.json
    fields:
      - name: entries
        label: Entries
        type: object
        list: true
        fields:
          - name: id
            label: URL ID (no spaces)
            type: string
          - name: title
            label: Entry Title
            type: string
          - name: type
            label: Entry Type
            type: select
            options:
              values:
                - OBSERVATION
                - OPINION
                - HOT TAKE
                - REFLECTION
                - QUOTE
                - BOOK HAUL
                - RECOMMENDATION
                - LIFE
          - name: date
            label: Date
            type: date
          - name: text
            label: Entry Content
            type: rich-text
          - name: attribution
            label: Attribution
            type: string
            required: false
