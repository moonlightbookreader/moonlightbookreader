media:
  input: content/images
  output: /content/images

content:
  - name: site
    label: Site Profile & Social
    type: file
    path: content/site.json
    fields:
      - name: name
        label: Your Name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: profileImage
        label: Profile Photo
        type: image
        optional: true
      - name: goodreads
        label: Goodreads URL
        type: string
        optional: true
      - name: storygraph
        label: Storygraph URL
        type: string
        optional: true
      - name: instagram
        label: Instagram URL
        type: string
        optional: true
      - name: twitter
        label: X / Twitter URL
        type: string
        optional: true
      - name: threads
        label: Threads URL
        type: string
        optional: true
      - name: tiktok
        label: TikTok URL
        type: string
        optional: true
      - name: youtube
        label: YouTube URL
        type: string
        optional: true
      - name: pinterest
        label: Pinterest URL
        type: string
        optional: true
      - name: letterboxd
        label: Letterboxd URL
        type: string
        optional: true
      - name: bloglovin
        label: Bloglovin URL
        type: string
        optional: true
      - name: mastodon
        label: Mastodon URL
        type: string
        optional: true
      - name: redbubble
        label: Redbubble Shop URL
        type: string
        optional: true
      - name: amazon
        label: Amazon Profile URL
        type: string
        optional: true
      - name: amazonWishlist
        label: Amazon Wishlist URL
        type: string
        optional: true
      - name: etsy
        label: Etsy Shop URL
        type: string
        optional: true
      - name: kofi
        label: Ko-fi URL
        type: string
        optional: true
      - name: email
        label: Email Address
        type: string
        optional: true

  - name: about
    label: About Page
    type: file
    path: content/about.json
    fields:
      - name: introLine
        label: Intro Line
        type: string
      - name: heading
        label: Heading
        type: string
      - name: bioParagraphs
        label: Bio Text
        type: list
        items:
          type: textarea
      - name: signoff
        label: Sign-off Line
        type: string

  - name: books
    label: Book Reviews
    type: file
    path: content/books.json
    fields:
      - name: entries
        label: Reviews
        type: list
        items:
          type: object
          fields:
            - name: id
              label: ID
              type: string
              description: Simple unique slug like midnight-library, no spaces
            - name: title
              label: Title
              type: string
            - name: author
              label: Author
              type: string
            - name: category
              label: Category
              type: select
              options:
                - Fiction
                - Fantasy
                - Mystery
                - Sci-Fi
                - Romance
                - Non-Fiction
                - Classics
            - name: format
              label: Format
              type: select
              options:
                - Physical
                - Audiobook
                - E-Book
              optional: true
            - name: rating
              label: Rating
              type: number
              min: 1
              max: 5
            - name: date
              label: Date
              type: date
            - name: coverImage
              label: Cover Image
              type: image
              optional: true
            - name: excerpt
              label: Excerpt
              type: text
            - name: fullReview
              label: Full Review
              type: rich-text
              description: Use the image button to insert photos
            - name: highlights
              label: Highlights
              type: list
              items:
                type: string
            - name: verdict
              label: Verdict
              type: text

  - name: journal
    label: Journal Entries
    type: file
    path: content/journal.json
    fields:
      - name: entries
        label: Entries
        type: list
        items:
          type: object
          fields:
            - name: id
              label: ID
              type: string
              description: Simple unique slug like rainy-sunday, no spaces
            - name: title
              label: Title
              type: string
            - name: type
              label: Type
              type: select
              options:
                - OBSERVATION
                - OPINION
                - HOT TAKE
                - REFLECTION
                - QUOTE
            - name: date
              label: Date
              type: date
            - name: text
              label: Content
              type: rich-text
              description: Use the image button to insert photos
            - name: attribution
              label: Attribution
              type: string
              optional: true
