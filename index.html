<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moonlight Book Reader</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root {
      --bg: #0f0b1a;
      --bg-soft: #1a142b;
      --accent: #d4a857;
      --accent-soft: rgba(212,168,87,.12);
      --text: #e6e0d2;
      --text-soft: #b8b0a0;
      --card: rgba(26,20,43,.7);
      --border: rgba(212,168,87,.18);
      --shadow: 0 8px 32px rgba(0,0,0,.35);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: radial-gradient(circle at top, #1a142b 0%, #0f0b1a 60%);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 0 1.5rem; }
    header { text-align: center; padding: 3rem 0 2rem; }
    .moon-icon { font-size: 3rem; color: var(--accent); margin-bottom: 1rem; }
    h1 { font-size: 2rem; font-weight: 400; color: var(--accent); letter-spacing: 2px; }
    .tagline { color: var(--text-soft); font-style: italic; margin-top: .5rem; }
    nav { display: flex; justify-content: center; gap: 2rem; margin-bottom: 3rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    nav a { color: var(--text-soft); text-decoration: none; transition: color .3s; }
    nav a:hover, nav a.active { color: var(--accent); }
    section { display: none; }
    section.active { display: block; }
    .profile-card { text-align: center; padding: 2rem; background: var(--card); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 2rem; }
    .profile-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); margin-bottom: 1rem; }
    .profile-name { font-size: 1.5rem; color: var(--accent); }
    .profile-tagline { color: var(--text-soft); font-style: italic; margin-bottom: 1rem; }
    #socialLinks { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 1rem; }
    .social-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 50%; background: var(--accent-soft);
      color: var(--accent); border: 1px solid rgba(212,168,87,.2);
      text-decoration: none; transition: all .25s ease;
    }
    .social-icon:hover { background: rgba(212,168,87,.25); transform: translateY(-2px); }
    .book-card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1.5rem; transition: transform .25s ease; }
    .book-card:hover { transform: translateY(-3px); border-color: rgba(212,168,87,.4); }
    .book-header { display: flex; gap: 1.2rem; margin-bottom: 1rem; }
    .book-cover { width: 90px; height: 130px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .book-meta { flex: 1; }
    .book-title { font-size: 1.25rem; color: var(--accent); margin-bottom: .25rem; }
    .book-author { color: var(--text-soft); font-size: .9rem; margin-bottom: .5rem; }
    .book-rating { color: var(--accent); letter-spacing: 2px; }
    .book-category { display: inline-block; font-size: .75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); border: 1px solid var(--accent); padding: .15rem .5rem; border-radius: 4px; margin-top: .5rem; }
    .book-excerpt { color: var(--text-soft); margin: 1rem 0; font-style: italic; }
    .book-highlights { margin: 1rem 0; padding-left: 1.2rem; }
    .book-highlights li { margin-bottom: .5rem; color: var(--text-soft); }
    .book-verdict { font-style: italic; border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1rem; }
    .journal-entry { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1.5rem; }
    .journal-type { display: inline-block; font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); border: 1px solid var(--accent); padding: .2rem .5rem; border-radius: 4px; margin-bottom: .5rem; }
    .journal-date { color: var(--text-soft); font-size: .85rem; margin-bottom: 1rem; }
    .about-section { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 2rem; }
    .about-section h2 { color: var(--accent); margin-bottom: 1.5rem; text-align: center; }
    .about-section p { margin-bottom: 1rem; }
    footer { text-align: center; padding: 2rem 0 3rem; color: var(--text-soft); font-size: .9rem; border-top: 1px solid var(--border); margin-top: 3rem; }
    .empty-state { text-align: center; padding: 3rem; color: var(--text-soft); font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="moon-icon">☾</div>
      <h1 id="siteTitle">Moonlight Book Reader</h1>
      <p class="tagline" id="siteTagline">your nocturnal reading companion</p>
    </header>

    <nav>
      <a href="#home" class="active" data-section="home">Home</a>
      <a href="#books" data-section="books">Reviews</a>
      <a href="#journal" data-section="journal">Journal</a>
      <a href="#about" data-section="about">About</a>
    </nav>

    <section id="home" class="active">
      <div class="profile-card">
        <img id="profileImg" src="" alt="Profile" class="profile-img" onerror="this.style.display='none'">
        <h2 class="profile-name" id="profileName">Your Name</h2>
        <p class="profile-tagline" id="profileTagline">Your tagline here...</p>
        <div id="socialLinks"></div>
      </div>
      <h3 style="color:var(--accent);margin:2rem 0 1rem;">Latest Reviews</h3>
      <div id="latestBooks"></div>
      <h3 style="color:var(--accent);margin:2rem 0 1rem;">Latest Journal Entries</h3>
      <div id="latestJournal"></div>
    </section>

    <section id="books">
      <h2 style="color:var(--accent);margin-bottom:1.5rem;">Book Reviews</h2>
      <div id="allBooks"></div>
    </section>

    <section id="journal">
      <h2 style="color:var(--accent);margin-bottom:1.5rem;">Reading Journal</h2>
      <div id="allJournal"></div>
    </section>

    <section id="about">
      <div class="about-section">
        <h2 id="aboutHeading">About Me</h2>
        <p id="aboutIntro" style="text-align:center;font-style:italic;margin-bottom:2rem;color:var(--text-soft);"></p>
        <div id="aboutBio"></div>
        <p id="aboutSignoff" style="text-align:center;font-style:italic;margin-top:2rem;color:var(--accent);"></p>
      </div>
    </section>

    <footer>
      <p>☾ Moonlight Book Reader · Written under the same moon ✨</p>
    </footer>
  </div>

  <script>
    // Navigation
    document.querySelectorAll('nav a').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
        link.classList.add('active');
        document.getElementById(link.dataset.section).classList.add('active');
      });
    });

    // All social platforms — leave blank = icon hidden automatically
    const siteProfile = {
      name: null,
      tagline: null,
      profileImage: null,
      goodreads: null,
      storygraph: null,
      instagram: null,
      twitter: null,
      threads: null,
      tiktok: null,
      youtube: null,
      pinterest: null,
      letterboxd: null,
      bloglovin: null,
      mastodon: null,
      redbubble: null,
      amazon: null,
      amazonWishlist: null,
      etsy: null,
      kofi: null,
      email: null
    };

    let aboutData = { introLine: '', heading: '', bioParagraphs: [], signoff: '' };
    let books = [];
    let journal = [];

    // Load all content
    Promise.all([
      fetch('content/site.json').then(r => r.json()).catch(() => ({})),
      fetch('content/about.json').then(r => r.json()).catch(() => ({})),
      fetch('content/books/index.json').then(r => r.json()).catch(() => []),
      fetch('content/journal/index.json').then(r => r.json()).catch(() => [])
    ]).then(([site, about, booksList, journalList]) => {
      Object.assign(siteProfile, site);
      aboutData = { ...aboutData, ...about };
      books = booksList;
      journal = journalList;
      renderAll();
    }).catch(err => console.log('Content loading:', err));

    function renderAll() {
      renderProfile();
      renderSocialLinks();
      renderAbout();
      renderBooks();
      renderJournal();
    }

    function renderProfile() {
      if (siteProfile.name) document.getElementById('profileName').textContent = siteProfile.name;
      if (siteProfile.tagline) {
        document.getElementById('profileTagline').textContent = siteProfile.tagline;
        document.getElementById('siteTagline').textContent = siteProfile.tagline;
      }
      if (siteProfile.profileImage) {
        document.getElementById('profileImg').src = siteProfile.profileImage;
      }
    }
