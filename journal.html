<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal — Moonlight Book Reader</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">
    <div class="container">
      <header class="site-header">
        <div class="site-brand">
          <a href="index.html" class="site-title">Moonlight Book Reader</a>
          <p class="site-tagline" id="siteTagline">your nocturnal reading companion</p>
        </div>
        <nav>
          <a href="index.html">Home</a>
          <a href="books.html">Reviews</a>
          <a href="journal.html" class="active">Journal</a>
          <a href="about.html">About</a>
        </nav>
      </header>

      <section>
        <div class="section-header">
          <span class="section-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
          </span>
          <h2>Moonlit Musings</h2>
          <span class="handwritten">— thoughts, notes & quiet reflections</span>
        </div>

        <div id="journalContainer">
          <!-- Journal entries will appear here automatically -->
          <div class="empty-state">Loading entries... 🌙</div>
        </div>
      </section>
    </div>

    <footer class="site-footer">
      <p><span class="handwritten">☾ Moonlight Book Reader · written under the same moon ✨</span></p>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>
    loadAllData().then(() => {
      renderProfile();
      renderSocialLinks('socialLinks');
      
      const container = document.getElementById('journalContainer');
      if (journalEntries.length === 0) {
        container.innerHTML = '<div class="empty-state">No entries yet... thoughts coming soon 🌙</div>';
      } else {
        container.innerHTML = journalEntries.map(e => renderJournalEntry(e, false)).join('');
      }
    });
  </script>
</body>
</html>
