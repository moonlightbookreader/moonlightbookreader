<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal — Moonlight Book Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=100">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <div class="stars"></div>
  <div class="moon-drift"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="site-brand">
        <a href="index.html" class="site-title">Moonlight Book Reader</a>
        <p class="site-tagline">your nocturnal reading companion</p>
      </div>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="books.html">Reviews</a>
        <a href="journal.html" class="active">Journal</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="content-wrapper">
    <section class="page-intro">
      <h1>Reading Journal</h1>
      <p>Thoughts, musings, and moments from my literary nights.</p>
    </section>

    <div class="filter-container">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="OBSERVATION">Observation</button>
      <button class="filter-btn" data-filter="OPINION">Opinion</button>
      <button class="filter-btn" data-filter="Book Haul">Book Haul</button>
      <button class="filter-btn" data-filter="Recommendation">Recommendation</button>
      <button class="filter-btn" data-filter="Life">Life</button>
      <button class="filter-btn" data-filter="QUOTE">Quote</button>
    </div>

    <div id="journal-container" class="cards-grid">
      <p class="loading">Gathering thoughts by moonlight...</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>— Read by moonlight — © 2026 Moonlight Book Reader</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
