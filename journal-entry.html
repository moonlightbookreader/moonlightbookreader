<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal Entry — Moonlight Book Reader</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="moon-icon">☾</div>
      <h1 id="siteTitle">Moonlight Book Reader</h1>
      <p class="tagline" id="siteTagline">your nocturnal reading companion</p>
    </header>

    <nav>
      <a href="index.html">Home</a>
      <a href="books.html">Reviews</a>
      <a href="journal.html" class="active">Journal</a>
      <a href="about.html">About</a>
    </nav>

    <p class="breadcrumb"><a href="journal.html">← Back to journal</a></p>
    <div id="entryDetail"></div>

    <footer>
      <p>☾ Moonlight Book Reader · Written under the same moon ✨</p>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>
    loadAllData().then(() => {
      renderProfile();
      const entryId = getUrlParam('id');
      const entry = journalEntries.find(e => e.id === entryId);
      const container = document.getElementById('entryDetail');
      
      if (!entry) {
        container.innerHTML = '<div class="empty-state">Entry not found. <a href="journal.html">Back to journal</a></div>';
        document.title = 'Not Found — Moonlight Book Reader';
      } else {
        document.title = `${entry.title} — Moonlight Book Reader`;
        container.innerHTML = renderJournalEntry(entry, true);
      }
    });
  </script>
</body>
</html>
