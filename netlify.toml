[build]
  publish = "."

# Headers for JSON content files
[[headers]]
  for = "/content/*.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
